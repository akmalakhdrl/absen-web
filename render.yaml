services:
  - type: web
    name: absensi-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install --prefix backend
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: ENFORCE_WIFI_VALIDATION
        value: "false"
      - key: ALLOWED_IP_PREFIXES
        value: ""
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_FILE
        value: ./data/attendance.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_UPLOAD_SIZE
        value: "5242880"
# Catatan: Render free tier tidak menyediakan persistent disk.
# Database SQLite & folder uploads akan reset setiap redeploy.
# Untuk produksi sungguhan, upgrade ke Starter plan ($7/mo) lalu uncomment:
#    disk:
#      name: absensi-data
#      mountPath: /opt/render/project/src/backend/data
#      sizeGB: 1
