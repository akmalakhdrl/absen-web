<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>Sistem Absensi</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-logo">A</div>
        <div>
          <h1 class="brand-title">Sistem Absensi</h1>
          <p class="brand-subtitle">Foto wajah &middot; Validasi WiFi &middot; Realtime</p>
        </div>
      </div>
      <nav class="nav">
        <a href="#" id="tabAbsen" class="nav-link active">Absen</a>
        <a href="#" id="tabData" class="nav-link">Data</a>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    <!-- Halaman Absensi -->
    <div id="sectionAbsen">
      <section class="grid">
        <!-- Card Kamera -->
        <div class="card camera-card">
          <div class="card-header">
            <h2>Foto Wajah</h2>
            <span id="cameraStatus" class="badge badge-muted">Menyiapkan kamera...</span>
          </div>

          <div class="camera-wrapper">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas" hidden></canvas>
            <img id="preview" alt="Preview foto" hidden />
            <div id="cameraOverlay" class="camera-overlay">
              <div class="spinner"></div>
              <p>Memuat kamera...</p>
            </div>
          </div>

          <div class="camera-actions">
            <button type="button" id="btnCapture" class="btn btn-primary" disabled>
              Ambil Foto
            </button>
            <button type="button" id="btnRetake" class="btn btn-secondary" hidden>
              Ulangi
            </button>
          </div>
        </div>

        <!-- Card Form -->
        <div class="card form-card">
          <div class="card-header">
            <h2>Data Absensi</h2>
            <span id="wifiStatus" class="badge badge-muted">Cek jaringan...</span>
          </div>

          <form id="attendanceForm" class="form" novalidate>
            <div class="form-group">
              <label for="name">Nama Lengkap</label>
              <input type="text" id="name" name="name" placeholder="Contoh: Budi Santoso" required />
              <small class="error-text" data-error-for="name"></small>
            </div>

            <div class="form-group">
              <label for="status">Jenis Absensi</label>
              <select id="status" name="status" required>
                <option value="">-- Pilih --</option>
                <option value="berangkat">Berangkat</option>
                <option value="pulang">Pulang</option>
              </select>
              <small class="error-text" data-error-for="status"></small>
            </div>

            <div class="info-row">
              <div class="info-item">
                <span class="info-label">Tanggal</span>
                <span id="currentDate" class="info-value">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">Jam</span>
                <span id="currentTime" class="info-value">-</span>
              </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-primary btn-block">
              <span class="btn-label">Submit Absensi</span>
              <span class="btn-spinner" hidden></span>
            </button>
          </form>
        </div>
      </section>
    </div>

    <!-- Halaman Riwayat Data Absensi (Hanya Terbuka untuk Admin) -->
    <div id="sectionData" hidden>
      <div class="card">
        <div class="card-header">
          <div>
            <h2>Riwayat Absensi</h2>
            <p class="muted" id="totalCount">Memuat data...</p>
          </div>
          <div class="card-actions">
            <button type="button" id="btnRefresh" class="btn btn-secondary">Refresh</button>
            <button type="button" id="btnExport" class="btn btn-primary">Export Excel</button>
            <button type="button" id="btnDeleteAll" class="btn btn-secondary">Hapus Semua</button>
          </div>
        </div>

        <div class="filter-bar">
          <input type="text" id="searchInput" class="search-input" placeholder="Cari nama / status..." />
        </div>

        <div class="table-wrapper">
          <table class="data-table" id="dataTable">
            <thead>
              <tr>
                <th>No</th>
                <th>Foto</th>
                <th>Nama</th>
                <th>Status</th>
                <th>Tanggal</th>
                <th>Jam</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr>
                <td colspan="7" class="loading-cell">Memuat...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal preview foto -->
  <div id="photoModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-content">
      <button type="button" class="modal-close" data-close-modal aria-label="Tutup">&times;</button>
      <img id="modalImage" alt="Foto absensi" />
    </div>
  </div>

  <!-- Toast notifikasi -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="app-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Sistem Absensi. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
