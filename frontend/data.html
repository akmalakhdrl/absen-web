<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>Data Absensi</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-logo">A</div>
        <div>
          <h1 class="brand-title">Sistem Absensi</h1>
          <p class="brand-subtitle">Foto wajah &middot; Validasi WiFi &middot; Realtime</p>
        </div>
      </div>
      <nav class="nav">
        <a href="index.html" class="nav-link">Absen</a>
        <a href="data.html" class="nav-link active">Data</a>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    <div class="card">
      <div class="card-header">
        <div>
          <h2>Riwayat Absensi</h2>
          <p class="muted" id="totalCount">Memuat data...</p>
        </div>
        <div class="card-actions">
          <button type="button" id="btnRefresh" class="btn btn-secondary">Refresh</button>
          <a href="/api/attendance/export" class="btn btn-primary" id="btnExport">
            Export Excel
          </a>
        </div>
      </div>

      <div class="filter-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Cari nama / NIP / jenis..." />
      </div>

      <div class="table-wrapper">
        <table class="data-table" id="dataTable">
          <thead>
            <tr>
              <th>No</th>
              <th>Foto</th>
              <th>Nama</th>
              <th>NIP / ID</th>
              <th>Jenis</th>
              <th>Tanggal</th>
              <th>Jam</th>
              <th>Catatan</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="8" class="loading-cell">Memuat...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal preview foto -->
  <div id="photoModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-content">
      <button type="button" class="modal-close" data-close-modal aria-label="Tutup">&times;</button>
      <img id="modalImage" alt="Foto absensi" />
    </div>
  </div>

  <footer class="app-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Sistem Absensi. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
</body>
</html>
